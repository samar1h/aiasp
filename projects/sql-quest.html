<script>
window.__errLog = [];
function showErrorBanner(msg, detail){
  window.__errLog.push({msg:msg, detail:detail, t:new Date().toISOString()});
  var existing = document.getElementById('__errBanner');
  if(existing){ existing.remove(); }
  var b = document.createElement('div');
  b.id = '__errBanner';
  b.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:999999;background:#1c1917;color:#fed7aa;font-family:monospace;font-size:12px;padding:10px 12px;box-shadow:0 -2px 10px rgba(0,0,0,.4);';
  var top = document.createElement('div');
  top.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:8px;';
  var t = document.createElement('span');
  t.textContent = '⚠ ' + msg;
  var closeBtn = document.createElement('button');
  closeBtn.textContent = '✕';
  closeBtn.style.cssText = 'background:none;border:none;color:#fed7aa;font-size:14px;padding:4px 8px;cursor:pointer;';
  closeBtn.onclick = function(){ b.remove(); };
  top.appendChild(t); top.appendChild(closeBtn);
  b.appendChild(top);
  var details = document.createElement('details');
  details.style.cssText = 'margin-top:6px;';
  var summary = document.createElement('summary');
  summary.textContent = 'Technical details';
  summary.style.cssText = 'cursor:pointer;color:#fdba74;';
  var pre = document.createElement('pre');
  pre.style.cssText = 'white-space:pre-wrap;word-break:break-word;margin-top:6px;color:#e7e5e4;max-height:120px;overflow:auto;';
  pre.textContent = detail || 'No additional details';
  details.appendChild(summary); details.appendChild(pre);
  b.appendChild(details);
  document.body ? document.body.appendChild(b) : window.addEventListener('DOMContentLoaded', function(){ document.body.appendChild(b); });
}
window.onerror = function(message, source, lineno, colno, error){
  showErrorBanner('Something went wrong: ' + message, (error && error.stack) ? error.stack : (source + ':' + lineno + ':' + colno));
  return false;
};
window.addEventListener('unhandledrejection', function(event){
  var reason = event.reason;
  var msg = (reason && reason.message) ? reason.message : String(reason);
  showErrorBanner('Something went wrong: ' + msg, (reason && reason.stack) ? reason.stack : String(reason));
});
</script>

<script type="text/babel" id="app-script">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

const COLOR_MAP = {
  orange: { bg:'bg-orange-50', text:'text-orange-600', border:'border-orange-200', solid:'bg-orange-600', ring:'ring-orange-300', chip:'bg-orange-100 text-orange-700' },
  sky: { bg:'bg-sky-100', text:'text-sky-600', border:'border-sky-200', solid:'bg-sky-600', ring:'ring-sky-300', chip:'bg-sky-100 text-sky-700' },
  leaf: { bg:'bg-leaf-100', text:'text-leaf-600', border:'border-leaf-200', solid:'bg-leaf-600', ring:'ring-leaf-300', chip:'bg-leaf-100 text-leaf-700' }
};

function useLocalState(key, initial){
  const [state, setState] = useState(() => {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : initial;
    } catch(e){ return initial; }
  });
  useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(state)); } catch(e){}
  }, [key, state]);
  return [state, setState];
}

function Icon({ name, size = 20, className = '' }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = '';
      try {
        const el = document.createElement('i');
        el.setAttribute('data-lucide', name);
        ref.current.appendChild(el);
        window.lucide.createIcons({ nodes: [el] });
      } catch(e){}
    }
  }, [name]);
  return <span ref={ref} className={className} style={{display:'inline-flex', width:size, height:size}}></span>;
}

function parseInline(text){
  if(!text) return null;
  const parts = String(text).split(/(\*\*[^*]+\*\*|`[^`]+`)/g).filter(Boolean);
  return parts.map((p, i) => {
    if(p.startsWith('**') && p.endsWith('**')){
      return <strong key={i} className="font-semibold text-ink">{p.slice(2,-2)}</strong>;
    }
    if(p.startsWith('`') && p.endsWith('`')){
      return <code key={i} className="font-mono text-[13px] bg-sand-100 text-orange-700 px-1.5 py-0.5 rounded-md">{p.slice(1,-1)}</code>;
    }
    return <span key={i}>{p}</span>;
  });
}

function RichText({ text, className }){
  const lines = String(text||'').split('\n');
  return <div className={className}>{lines.map((l,i) => <p key={i} className={i>0 ? 'mt-2' : ''}>{parseInline(l)}</p>)}</div>;
}

function computeRows(step, baseTable){
  const t = window.SQLQ_TABLES[baseTable];
  const fn = step.resultRowsFn;
  if(!fn) return [];
  if(fn === 'all') return t.rows.map(r => ({row:r, match:true}));
  if(fn.startsWith('cols:')){
    const cols = fn.slice(5).split(',');
    const idxs = cols.map(c => t.columns.indexOf(c));
    return t.rows.map(r => ({row: idxs.map(i => r[i]), match:true}));
  }
  if(fn.startsWith('where:')){
    const cond = fn.slice(6);
    if(cond === 'species=Dog'){
      const sIdx = t.columns.indexOf('species');
      return t.rows.map(r => ({row:r, match: r[sIdx]==='Dog'}));
    }
    if(cond === 'age>3'){
      const aIdx = t.columns.indexOf('age');
      return t.rows.map(r => ({row:r, match: r[aIdx] > 3}));
    }
    if(cond === 'dogyoung'){
      const sIdx = t.columns.indexOf('species'); const aIdx = t.columns.indexOf('age');
      return t.rows.map(r => ({row:r, match: r[sIdx]==='Dog' && r[aIdx] < 2}));
    }
  }
  if(fn.startsWith('orderby:')){
    const [,col,dir] = fn.split(':');
    const idx = t.columns.indexOf(col);
    const sorted = [...t.rows].sort((a,b) => dir==='desc' ? b[idx]-a[idx] : a[idx]-b[idx]);
    return sorted.map(r => ({row:r, match:true}));
  }
  if(fn.startsWith('distinct:')){
    const col = fn.slice(9);
    const idx = t.columns.indexOf(col);
    const seen = new Set(); const out = [];
    t.rows.forEach(r => { if(!seen.has(r[idx])){ seen.add(r[idx]); out.push({row:[r[idx]], match:true}); } });
    return out;
  }
  if(fn === 'count:all'){
    return [{row:[t.rows.length], match:true}];
  }
  if(fn.startsWith('avg:')){
    const col = fn.slice(4); const idx = t.columns.indexOf(col);
    const avg = t.rows.reduce((s,r)=>s+r[idx],0)/t.rows.length;
    return [{row:[Math.round(avg*100)/100], match:true}];
  }
  if(fn.startsWith('groupby:')){
    const [,col] = fn.split(':');
    const idx = t.columns.indexOf(col);
    const groups = {};
    t.rows.forEach(r => { groups[r[idx]] = (groups[r[idx]]||0)+1; });
    return Object.keys(groups).map(k => ({row:[k, groups[k]], match:true}));
  }
  if(fn === 'join'){
    const custT = window.SQLQ_TABLES.customers;
    const ordT = window.SQLQ_TABLES.orders;
    const nameIdx = custT.columns.indexOf('name');
    const custIdx = ordT.columns.indexOf('customer');
    const itemIdx = ordT.columns.indexOf('item');
    const priceIdx = ordT.columns.indexOf('price');
    const out = [];
    ordT.rows.forEach(orow => {
      const cust = custT.rows.find(crow => crow[nameIdx] === orow[custIdx]);
      if(cust) out.push({row:[orow[custIdx], orow[itemIdx], orow[priceIdx]], match:true});
    });
    return out;
  }
  return t.rows.map(r => ({row:r, match:true}));
}

function LiveQueryStep({ step, onComplete, completed }){
  const [phase, setPhase] = useState('idle');
  const baseTable = window.SQLQ_TABLES[step.table];
  const [displayRows, setDisplayRows] = useState(() => baseTable.rows.map(r => ({row:r})));
  const [resultCols, setResultCols] = useState(baseTable.columns);
  const [showResult, setShowResult] = useState(false);
  const [insertedTracker, setInsertedTracker] = useState(false);

  useEffect(() => {
    setPhase('idle'); setShowResult(false);
    let rows = baseTable.rows;
    if(step.mutation === 'update' && step.needsInsertFirst){
      rows = [...baseTable.rows, [7,'Coco','Dog',1,'Sana']];
    }
    setDisplayRows(rows.map(r => ({row:r})));
    setResultCols(baseTable.columns);
  }, [step]);

  function run(){
    if(phase === 'running') return;
    setPhase('running');
    setTimeout(() => {
      if(step.mutation === 'insert'){
        setDisplayRows(prev => [...prev, { row: step.insertRow, animIn:true }]);
        setResultCols(baseTable.columns);
        setPhase('done'); setShowResult(true);
      } else if(step.mutation === 'update'){
        setDisplayRows(prev => prev.map(r => {
          if(r.row[baseTable.columns.indexOf(step.updateMatch.col)] === step.updateMatch.val){
            const nr = [...r.row];
            nr[baseTable.columns.indexOf(step.updateSet.col)] = step.updateSet.val;
            return { row: nr, flashCol: baseTable.columns.indexOf(step.updateSet.col) };
          }
          return r;
        }));
        setResultCols(baseTable.columns);
        setPhase('done'); setShowResult(true);
      } else if(step.mutation === 'delete'){
        setDisplayRows(prev => prev.map(r => r.row[baseTable.columns.indexOf(step.deleteMatch.col)] === step.deleteMatch.val ? {...r, animOut:true} : r));
        setTimeout(() => {
          setDisplayRows(prev => prev.filter(r => r.row[baseTable.columns.indexOf(step.deleteMatch.col)] !== step.deleteMatch.val));
        }, 340);
        setResultCols(baseTable.columns);
        setPhase('done'); setShowResult(true);
      } else {
        const computed = computeRows(step, step.table);
        if(step.filterAnim){
          setDisplayRows(computed.map(c => ({ row:c.row, dim: !c.match })));
          setResultCols(step.resultCols);
          setTimeout(() => setShowResult(true), 500);
        } else if(step.sortAnim){
          setDisplayRows(computed.map(c => ({row:c.row})));
          setResultCols(step.resultCols);
          setTimeout(() => setShowResult(true), 400);
        } else if(step.groupAnim || step.joinAnim){
          setResultCols(step.resultCols);
          setDisplayRows(computed.map(c => ({row:c.row, animIn:true})));
          setTimeout(() => setShowResult(true), 300);
        } else {
          setResultCols(step.resultCols);
          setDisplayRows(computed.filter(c=>c.match).map(c => ({row:c.row})));
          setTimeout(() => setShowResult(true), 300);
        }
        setPhase('done');
      }
      if(!completed) onComplete(step.xp);
    }, 550);
  }

  return (
    <div className="space-y-4">
      <div className="bg-ink rounded-2xl p-4 font-mono text-[13px] leading-relaxed text-orange-100 whitespace-pre-wrap break-words shadow-card relative">
        {step.query}
        {phase === 'running' && (
          <div className="absolute inset-0 bg-ink/70 rounded-2xl flex items-center justify-center gap-1.5">
            <span className="w-1.5 h-1.5 rounded-full bg-orange-300 typing-dot" style={{animationDelay:'0s'}}></span>
            <span className="w-1.5 h-1.5 rounded-full bg-orange-300 typing-dot" style={{animationDelay:'.15s'}}></span>
            <span className="w-1.5 h-1.5 rounded-full bg-orange-300 typing-dot" style={{animationDelay:'.3s'}}></span>
          </div>
        )}
      </div>
      <button onClick={run} disabled={phase==='running'} className="btn-press w-full bg-orange-600 hover:bg-orange-700 disabled:opacity-60 text-white font-semibold py-3.5 rounded-2xl flex items-center justify-center gap-2 shadow-pop">
        <Icon name="play" size={17} /> {phase==='done' ? 'Run again' : 'Run query'}
      </button>
      <MiniTable columns={showResult ? resultCols : baseTable.columns} rows={displayRows} />
      {showResult && (
        <div className="pop-in flex items-center gap-2 text-leaf-600 text-sm font-medium px-1">
          <Icon name="check-circle-2" size={16} /> Query complete
        </div>
      )}
    </div>
  );
}

function HomeScreen({ progress, onOpenChapter, onOpenPlayground, onReset }){
  const chapters = window.SQLQ_CHAPTERS;
  const totalXp = progress.totalXp || 0;
  const level = levelFromXp(totalXp);
  const xpIntoLevel = totalXp - xpForLevel(level);
  const xpPct = Math.min(100, (xpIntoLevel/60)*100);
  const [showReset, setShowReset] = useState(false);

  function chapterState(chapter, idx){
    const completedChapters = progress.completedChapters || {};
    if(completedChapters[chapter.id]) return 'done';
    if(idx === 0) return 'current';
    const prevChapter = chapters[idx-1];
    if(completedChapters[prevChapter.id]) return 'current';
    return 'locked';
  }

  const doneCount = chapters.filter(c => (progress.completedChapters||{})[c.id]).length;

  return (
    <div className="min-h-screen pb-10 safe-top">
      <div className="px-5 pt-6 pb-5 bg-white border-b border-sand-200 sticky top-0 z-30">
        <div className="flex items-center justify-between mb-4">
          <div className="flex items-center gap-2">
            <div className="w-9 h-9 rounded-xl bg-orange-600 flex items-center justify-center shadow-pop">
              <Icon name="database" size={18} className="text-white" />
            </div>
            <span className="font-display font-bold text-xl text-ink">SQL Quest</span>
          </div>
          <button onClick={() => setShowReset(true)} className="btn-press w-9 h-9 rounded-full bg-sand-100 flex items-center justify-center text-stone-400">
            <Icon name="rotate-ccw" size={16} />
          </button>
        </div>
        <div className="flex items-center gap-3">
          <div className="w-11 h-11 rounded-full bg-orange-100 flex items-center justify-center font-display font-bold text-orange-600 flex-shrink-0">{level}</div>
          <div className="flex-1">
            <div className="flex justify-between text-[11px] font-semibold text-stone-500 mb-1">
              <span>Level {level}</span>
              <span className="font-mono">{xpIntoLevel}/60 XP</span>
            </div>
            <div className="h-2.5 rounded-full bg-sand-100 overflow-hidden">
              <div className="h-full bg-gradient-to-r from-orange-400 to-orange-600 rounded-full xp-fill" style={{width: xpPct+'%'}}></div>
            </div>
          </div>
        </div>
      </div>

      <div className="px-5 pt-6">
        <div className="flex items-center justify-between mb-1">
          <h1 className="font-display text-2xl font-semibold text-ink">Your path</h1>
          <span className="text-xs font-mono text-stone-400">{doneCount}/{chapters.length} chapters</span>
        </div>
        <p className="text-sm text-stone-500 mb-6">Learn SQL in about an hour, one bite-sized chapter at a time.</p>
      </div>

      <div className="relative px-1">
        <div className="flex flex-col gap-7">
          {chapters.map((chapter, idx) => (
            <PathNode key={chapter.id} chapter={chapter} idx={idx} state={chapterState(chapter, idx)} xp={progress.totalXp} onOpen={onOpenChapter} />
          ))}
          <div className={`flex flex-col items-start pl-4 w-full ${chapters.length % 2 === 0 ? '' : 'items-end pr-4'}`}>
            <div className="flex items-center gap-3 opacity-50">
              <div className="w-16 h-16 rounded-full bg-sand-100 border-4 border-sand-200 flex items-center justify-center">
                <Icon name="shield" size={22} className="text-stone-400" />
              </div>
              <div>
                <div className="font-display font-semibold text-[15px] text-ink">Access Control</div>
                <div className="text-[11px] text-stone-500">Coming soon</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div className="px-5 mt-10">
        <button onClick={onOpenPlayground} className="btn-press w-full bg-ink text-white rounded-2xl p-5 flex items-center gap-4 shadow-card">
          <div className="w-12 h-12 rounded-xl bg-orange-600 flex items-center justify-center flex-shrink-0">
            <Icon name="terminal" size={22} className="text-white" />
          </div>
          <div className="text-left flex-1">
            <div className="font-display font-semibold text-lg">Playground</div>
            <div className="text-xs text-stone-300 mt-0.5">Run real SQL against a live database</div>
          </div>
          <Icon name="arrow-right" size={20} className="text-stone-400" />
        </button>
      </div>

      {showReset && (
        <div className="fixed inset-0 bg-ink/40 z-[100] flex items-end sm:items-center justify-center p-4" onClick={()=>setShowReset(false)}>
          <div className="bg-white rounded-2xl p-5 w-full max-w-sm card-enter" onClick={e=>e.stopPropagation()}>
            <h3 className="font-display text-lg font-semibold mb-1.5">Reset progress?</h3>
            <p className="text-sm text-stone-500 mb-4">This clears your XP and chapter progress. Can't be undone.</p>
            <div className="flex gap-3">
              <button onClick={()=>setShowReset(false)} className="btn-press flex-1 py-3 rounded-xl bg-sand-100 text-stone-600 font-semibold text-sm">Cancel</button>
              <button onClick={()=>{onReset(); setShowReset(false);}} className="btn-press flex-1 py-3 rounded-xl bg-red-600 text-white font-semibold text-sm">Reset</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

</script>
<script type="text/babel" id="app-script-2">

const SEED_SQL = `
CREATE TABLE pets (id INTEGER PRIMARY KEY, name TEXT, species TEXT, age INTEGER, owner TEXT);
INSERT INTO pets (name, species, age, owner) VALUES ('Biscuit','Dog',3,'Amara'),('Whiskers','Cat',5,'Leo'),('Tank','Turtle',12,'Amara'),('Pepper','Dog',1,'Sana'),('Milo','Cat',2,'Leo'),('Nibbles','Rabbit',4,'Priya');
CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT, city TEXT);
INSERT INTO customers (name, city) VALUES ('Amara','Austin'),('Leo','Denver'),('Sana','Austin'),('Priya','Boston');
CREATE TABLE orders (id INTEGER PRIMARY KEY, customer TEXT, item TEXT, qty INTEGER, price REAL);
INSERT INTO orders (customer, item, qty, price) VALUES ('Amara','Dog Leash',2,12.50),('Leo','Cat Toy',1,6.00),('Sana','Dog Bed',1,45.00),('Priya','Rabbit Hutch',1,89.99),('Amara','Cat Toy',3,6.00);
`;

const QUICK_SNIPPETS = [
  { label:'SELECT all', sql:'SELECT * FROM pets;' },
  { label:'WHERE', sql:"SELECT * FROM pets WHERE species = 'Dog';" },
  { label:'ORDER BY', sql:'SELECT * FROM pets ORDER BY age DESC;' },
  { label:'GROUP BY', sql:'SELECT species, COUNT(*) FROM pets GROUP BY species;' },
  { label:'JOIN', sql:'SELECT customers.name, orders.item FROM customers JOIN orders ON customers.name = orders.customer;' },
  { label:'INSERT', sql:"INSERT INTO pets (name, species, age, owner) VALUES ('Rex','Dog',4,'You');" },
  { label:'UPDATE', sql:"UPDATE pets SET age = age + 1 WHERE name = 'Rex';" },
  { label:'DELETE', sql:"DELETE FROM pets WHERE name = 'Rex';" }
];

function usePlaygroundDb(){
  const [db, setDb] = useState(null);
  const [status, setStatus] = useState('loading');
  const [error, setError] = useState(null);

  const init = useCallback(async () => {
    setStatus('loading'); setError(null);
    try {
      const SQL = await window.initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}` });
      const database = new SQL.Database();
      database.run(SEED_SQL);
      setDb(database);
      setStatus('ready');
    } catch(e){
      setError(e.message || String(e));
      setStatus('error');
    }
  }, []);

  useEffect(() => { init(); }, [init]);

  return { db, status, error, reload: init };
}

function ResultTable({ result }){
  if(!result) return null;
  if(result.error){
    return (
      <div className="bg-red-50 border border-red-200 text-red-700 rounded-2xl p-4 text-sm">
        <div className="font-semibold mb-1 flex items-center gap-1.5"><Icon name="alert-triangle" size={15} /> Query error</div>
        <div className="font-mono text-xs whitespace-pre-wrap break-words">{result.error}</div>
      </div>
    );
  }
  if(result.info){
    return (
      <div className="bg-leaf-100 border border-leaf-100 text-leaf-600 rounded-2xl p-4 text-sm flex items-center gap-2">
        <Icon name="check-circle-2" size={16} /> {result.info}
      </div>
    );
  }
  if(!result.columns || result.columns.length === 0){
    return <div className="text-center text-stone-400 text-sm py-6">No results</div>;
  }
  return (
    <div className="rounded-2xl border border-sand-200 bg-white overflow-hidden shadow-card">
      <div className="overflow-x-auto no-scrollbar">
        <table className="w-full text-[13px]">
          <thead>
            <tr className="bg-sand-50 border-b border-sand-200">
              {result.columns.map((c,i) => <th key={i} className="text-left px-3 py-2 font-mono font-semibold text-ink whitespace-nowrap">{c}</th>)}
            </tr>
          </thead>
          <tbody>
            {result.values.length === 0 && <tr><td colSpan={result.columns.length} className="px-3 py-6 text-center text-stone-400 text-xs">No rows</td></tr>}
            {result.values.map((row, ri) => (
              <tr key={ri} className="row-in border-b last:border-0 border-sand-100">
                {row.map((cell, ci) => <td key={ci} className="px-3 py-2 font-mono whitespace-nowrap text-stone-700">{cell === null ? <span className="text-stone-300 italic">null</span> : String(cell)}</td>)}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="px-3 py-2 bg-sand-50 border-t border-sand-200 text-[11px] text-stone-400 font-mono">{result.values.length} row{result.values.length!==1?'s':''}</div>
    </div>
  );
}

function SchemaPanel({ db, refreshKey }){
  const [tables, setTables] = useState([]);
  useEffect(() => {
    if(!db) return;
    try {
      const res = db.exec("SELECT name FROM sqlite_master WHERE type='table';");
      const names = res[0] ? res[0].values.map(v => v[0]) : [];
      const info = names.map(n => {
        const cols = db.exec(`PRAGMA table_info(${n});`);
        const colNames = cols[0] ? cols[0].values.map(v => ({name:v[1], type:v[2]})) : [];
        const count = db.exec(`SELECT COUNT(*) FROM ${n};`);
        return { name:n, columns: colNames, rowCount: count[0] ? count[0].values[0][0] : 0 };
      });
      setTables(info);
    } catch(e){}
  }, [db, refreshKey]);
  return (
    <div className="space-y-2">
      {tables.map(t => (
        <div key={t.name} className="bg-white rounded-xl border border-sand-200 p-3">
          <div className="flex items-center justify-between mb-1.5">
            <span className="font-mono font-semibold text-sm text-ink flex items-center gap-1.5"><Icon name="table-2" size={14} className="text-orange-500" />{t.name}</span>
            <span className="text-[11px] font-mono text-stone-400">{t.rowCount} rows</span>
          </div>
          <div className="flex flex-wrap gap-1">
            {t.columns.map(c => <span key={c.name} className="text-[10px] font-mono bg-sand-100 text-stone-500 px-1.5 py-0.5 rounded">{c.name}:{c.type}</span>)}
          </div>
        </div>
      ))}
    </div>
  );
}

function PlaygroundView({ onExit }){
  const { db, status, error, reload } = usePlaygroundDb();
  const [sql, setSql] = useState("SELECT * FROM pets;");
  const [result, setResult] = useState(null);
  const [running, setRunning] = useState(false);
  const [tab, setTab] = useState('query');
  const [refreshKey, setRefreshKey] = useState(0);
  const [history, setHistory] = useState([]);

  function runQuery(){
    if(!db || running) return;
    setRunning(true);
    setTimeout(() => {
      try {
        const trimmed = sql.trim();
        if(!trimmed){ setRunning(false); return; }
        const isSelect = /^\s*(select|pragma|explain)/i.test(trimmed);
        if(isSelect){
          const res = db.exec(trimmed);
          setResult(res[0] ? { columns: res[0].columns, values: res[0].values } : { columns: [], values: [] });
        } else {
          db.run(trimmed);
          const verb = trimmed.match(/^\s*(\w+)/)[1].toUpperCase();
          setResult({ info: `${verb} executed successfully` });
          setRefreshKey(k => k+1);
        }
        setHistory(h => [trimmed, ...h.filter(x=>x!==trimmed)].slice(0,8));
      } catch(e){
        setResult({ error: e.message || String(e) });
      }
      setRunning(false);
    }, 300);
  }

  function resetDb(){
    setResult(null);
    reload();
    setRefreshKey(k=>k+1);
  }

  return (
    <div className="fixed inset-0 bg-sand-50 z-50 flex flex-col safe-top safe-bottom">
      <div className="flex items-center gap-3 px-4 pt-4 pb-3 bg-white border-b border-sand-200">
        <button onClick={onExit} className="btn-press w-9 h-9 rounded-full bg-sand-100 flex items-center justify-center text-stone-500 flex-shrink-0">
          <Icon name="x" size={18} />
        </button>
        <div className="flex-1">
          <div className="font-display font-semibold text-lg text-ink leading-tight">Playground</div>
          <div className="text-[11px] text-stone-400">Real SQLite, running in your browser</div>
        </div>
        <button onClick={resetDb} className="btn-press w-9 h-9 rounded-full bg-sand-100 flex items-center justify-center text-stone-500 flex-shrink-0" title="Reset database">
          <Icon name="rotate-ccw" size={16} />
        </button>
      </div>

      <div className="flex px-4 pt-3 gap-2">
        <button onClick={()=>setTab('query')} className={`btn-press flex-1 py-2.5 rounded-xl font-semibold text-sm flex items-center justify-center gap-1.5 ${tab==='query' ? 'bg-ink text-white' : 'bg-white text-stone-500 border border-sand-200'}`}>
          <Icon name="terminal" size={15} /> Query
        </button>
        <button onClick={()=>setTab('schema')} className={`btn-press flex-1 py-2.5 rounded-xl font-semibold text-sm flex items-center justify-center gap-1.5 ${tab==='schema' ? 'bg-ink text-white' : 'bg-white text-stone-500 border border-sand-200'}`}>
          <Icon name="database" size={15} /> Tables
        </button>
      </div>

      {status === 'loading' && (
        <div className="flex-1 flex flex-col items-center justify-center gap-3 text-stone-400">
          <Icon name="loader-2" size={28} className="animate-spin" />
          <span className="text-sm">Loading SQL engine…</span>
        </div>
      )}
      {status === 'error' && (
        <div className="flex-1 flex flex-col items-center justify-center gap-3 text-stone-500 px-8 text-center">
          <Icon name="wifi-off" size={28} className="text-red-400" />
          <span className="text-sm">Couldn't load the SQL engine. Check your connection.</span>
          <details className="text-xs text-stone-400"><summary>Details</summary>{error}</details>
          <button onClick={reload} className="btn-press mt-2 px-4 py-2 rounded-xl bg-ink text-white text-sm font-semibold">Try again</button>
        </div>
      )}

      {status === 'ready' && tab === 'query' && (
        <div className="flex-1 overflow-y-auto px-4 pt-4 pb-4 no-scrollbar space-y-4">
          <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">
            {QUICK_SNIPPETS.map(s => (
              <button key={s.label} onClick={()=>setSql(s.sql)} className="btn-press flex-shrink-0 px-3 py-1.5 rounded-full bg-white border border-sand-200 text-xs font-mono text-stone-600 whitespace-nowrap">{s.label}</button>
            ))}
          </div>
          <textarea
            value={sql}
            onChange={e => setSql(e.target.value)}
            rows={4}
            spellCheck={false}
            className="w-full bg-ink text-orange-100 font-mono text-[13px] leading-relaxed rounded-2xl p-4 shadow-card resize-none outline-none focus:ring-2 focus:ring-orange-400"
            placeholder="Write SQL here…"
          />
          <button onClick={runQuery} disabled={running} className="btn-press w-full bg-orange-600 hover:bg-orange-700 disabled:opacity-60 text-white font-semibold py-3.5 rounded-2xl flex items-center justify-center gap-2 shadow-pop">
            {running ? <Icon name="loader-2" size={17} className="animate-spin" /> : <Icon name="play" size={17} />} Run
          </button>
          <ResultTable result={result} />
          {history.length > 0 && (
            <div>
              <div className="text-[11px] uppercase tracking-wide text-stone-400 font-semibold px-1 mb-1.5">Recent</div>
              <div className="space-y-1.5">
                {history.map((h,i) => (
                  <button key={i} onClick={()=>setSql(h)} className="btn-press w-full text-left bg-white border border-sand-200 rounded-lg px-3 py-2 font-mono text-[11px] text-stone-500 truncate block">{h}</button>
                ))}
              </div>
            </div>
          )}
        </div>
      )}

      {status === 'ready' && tab === 'schema' && (
        <div className="flex-1 overflow-y-auto px-4 pt-4 pb-4 no-scrollbar">
          <SchemaPanel db={db} refreshKey={refreshKey} />
          <div className="mt-4 bg-sky-100 border border-sky-200 rounded-xl p-3 text-xs text-sky-700 flex gap-2">
            <Icon name="info" size={14} className="flex-shrink-0 mt-0.5" />
            <span>This is a real, live database seeded with sample data. Changes you make with INSERT, UPDATE, or DELETE stick until you reset it.</span>
          </div>
        </div>
      )}
    </div>
  );
}

function App(){
  const [progress, setProgress] = useLocalState('sqlquest_progress', { totalXp:0, completedChapters:{}, stepCompletion:{}, lessonPositions:{} });
  const [view, setView] = useState('home');
  const [activeChapter, setActiveChapter] = useState(null);
  const [confetti, setConfetti] = useState(false);

  function handleStepComplete(chapterId, stepIdx, xp){
    setProgress(prev => {
      const stepDone = prev.stepCompletion?.[chapterId]?.[stepIdx];
      if(stepDone) return { ...prev, lessonPositions: { ...prev.lessonPositions, [chapterId]: stepIdx } };
      return {
        ...prev,
        totalXp: (prev.totalXp||0) + xp,
        stepCompletion: { ...prev.stepCompletion, [chapterId]: { ...(prev.stepCompletion?.[chapterId]||{}), [stepIdx]: true } },
        lessonPositions: { ...prev.lessonPositions, [chapterId]: stepIdx }
      };
    });
  }

  function handleChapterComplete(chapterId){
    setProgress(prev => {
      if(prev.completedChapters?.[chapterId]) return { ...prev, lessonPositions: { ...prev.lessonPositions, [chapterId]: 0 } };
      return { ...prev, completedChapters: { ...prev.completedChapters, [chapterId]: true }, lessonPositions: { ...prev.lessonPositions, [chapterId]: 0 } };
    });
    setConfetti(true);
    setTimeout(() => setConfetti(false), 2200);
  }

  function openChapter(chapter){
    setActiveChapter(chapter);
    setView('lesson');
  }

  function resetProgress(){
    setProgress({ totalXp:0, completedChapters:{}, stepCompletion:{}, lessonPositions:{} });
  }

  return (
    <>
      <Confetti active={confetti} />
      {view === 'home' && (
        <HomeScreen progress={progress} onOpenChapter={openChapter} onOpenPlayground={()=>setView('playground')} onReset={resetProgress} />
      )}
      {view === 'lesson' && activeChapter && (
        <LessonView chapter={activeChapter} progress={progress} onExit={()=>setView('home')} onStepComplete={handleStepComplete} onChapterComplete={handleChapterComplete} />
      )}
      {view === 'playground' && (
        <PlaygroundView onExit={()=>setView('home')} />
      )}
    </>
  );
}

try {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
  window.lucide && window.lucide.createIcons();
} catch(e){
  showErrorBanner('The app failed to start: ' + e.message, e.stack);
}
</script>
